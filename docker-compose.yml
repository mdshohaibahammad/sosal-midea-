version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: social_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: social_autoposter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: social_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: social_server
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=social_autoposter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=http://localhost:5173
      - BASE_URL=http://localhost:5000
      - NODE_ENV=production
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: social_client
    restart: always
    depends_on:
      - server
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  mysql_data:
  redis_data: